# Example deploy workflow for GitHub Pages.
#
# It generates assets/config.js from GitHub Secrets at deploy time,
# so the real Supabase URL/key are stored in
#   Repo → Settings → Secrets and variables → Actions
# instead of ever being committed to git history.
#
# Add secrets: SUPABASE_URL, SUPABASE_ANON_KEY
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Ensures only one deploy runs at a time. Without this, two overlapping
# runs (e.g. from re-running a job, or pushing twice quickly) can each
# try to upload an artifact named "github-pages" in the same run,
# which Pages rejects with "Multiple artifacts named github-pages
# were unexpectedly found". Cancelling the older, still-running deploy
# whenever a newer one starts avoids that entirely.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate assets/config.js from secrets
        run: |
          cat > assets/config.js <<EOF
          window.__SUPABASE_CONFIG__ = {
            url: "${{ secrets.SUPABASE_URL }}",
            anonKey: "${{ secrets.SUPABASE_ANON_KEY }}"
          };
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
