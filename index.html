<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Event Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <div class="center-shell">
    <div class="surface-card p-4 p-sm-5 auth-card">

      <div class="text-center mb-4">
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-muted-soft small mb-0">Sign in with your event-portal account.</p>
      </div>

      <div id="errorBanner" class="alert alert-danger py-2 small hidden" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="form-control" placeholder="name@example.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold">Password</label>
          <div class="input-group">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="form-control" placeholder="••••••••">
            <button type="button" id="togglePassword" class="btn btn-ghost" tabindex="-1">Show</button>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="form-check">
            <input id="remember-me" type="checkbox" class="form-check-input">
            <label for="remember-me" class="form-check-label small">Remember email</label>
          </div>
          <button type="button" id="forgotPasswordBtn" class="btn btn-link btn-sm p-0 small">Forgot password?</button>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-brand w-100 py-2 fw-semibold">
          <span id="btnText">Sign in</span>
          <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-2 hidden" role="status"></span>
        </button>
      </form>

      <p class="text-center small text-muted-soft mt-4 mb-0">
        Accounts are created by an administrator in Supabase — there is no public sign-up.
      </p>
    </div>
  </div>

  <!-- Forgot password modal -->
  <div id="forgotModal" class="modal-overlay hidden">
    <div class="surface-card p-4 auth-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h5 fw-bold mb-0">Reset password</h2>
        <button type="button" id="closeModalBtn" class="btn-close" aria-label="Close"></button>
      </div>
      <p class="small text-muted-soft">Enter your account email and we'll send a secure reset link.</p>
      <form id="forgotForm">
        <div class="mb-3">
          <label for="resetEmail" class="form-label small fw-semibold">Email address</label>
          <input id="resetEmail" type="email" required class="form-control" placeholder="name@example.com">
        </div>
        <div id="resetErrorBanner" class="alert alert-danger py-2 small hidden"></div>
        <div id="resetSuccessBanner" class="alert alert-success py-2 small hidden"></div>
        <button type="submit" id="resetSubmitBtn" class="btn btn-brand w-100 py-2 fw-semibold">
          <span id="resetBtnText">Send reset link</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Config must load before any module that imports supabaseClient.js -->
  <script src="./assets/js/config.js"></script>
  <script type="module" src="./assets/js/login.js"></script>
</body>
</html>
