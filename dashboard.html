<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./assets/styles.css">

<!-- Config + auth guard must run before the page is shown -->
<script src="./assets/config.js"></script>
<script type="module" src="./assets/authGuard.js"></script>
</head>
<body>
  <div class="app-shell">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
      <div>
        <h1 class="h5 fw-bold mb-1">Event registration</h1>
        <p class="text-muted-soft small mb-0">Attendance overview and registration list</p>
      </div>
      <div class="d-flex gap-2">
        <button id="rfBtn" class="btn btn-ghost btn-sm" type="button">Refresh</button>
        <button id="dlBtn" class="btn btn-brand btn-sm" type="button">Export CSV</button>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" type="button">Log out</button>
      </div>
    </div>

    <div id="logTerminal" class="log-terminal mb-3">Console initializing…</div>

    <div class="row row-cols-2 row-cols-md-4 g-3 mb-4">
      <div class="col"><div class="stat-card stat-invited"><div class="label">Total invited</div><div class="value" id="statInvited">–</div></div></div>
      <div class="col"><div class="stat-card stat-registered"><div class="label">Registered</div><div class="value" id="statRegistered">–</div></div></div>
      <div class="col"><div class="stat-card stat-pending"><div class="label">Not yet registered</div><div class="value" id="statPending">–</div></div></div>
      <div class="col"><div class="stat-card stat-walkin"><div class="label">Walk-ins</div><div class="value" id="statWalkin">–</div></div></div>
    </div>

    <h2 class="h6 fw-bold mb-2">Attendance list</h2>
    <div class="surface-card">
      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Registered at (UTC+7)</th>
              <th>Employee ID</th>
              <th>Full name</th>
              <th>Gender</th>
              <th>Position</th>
              <th>Department</th>
              <th>Business unit</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
