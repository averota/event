<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitees Uploader (CSV & Excel → Supabase)</title>

    <!-- SheetJS (xlsx) for parsing CSV, XLSX, and XLS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link rel="stylesheet" href="./assets/styles.css">
    <link rel="stylesheet" href="./invitees.css">

    <!-- Config + auth guard must run before the page is shown -->
    <script src="./assets/config.js"></script>
    <script type="module" src="./assets/authGuard.js"></script>
</head>
<body>

    <div class="wrap stack">

        <div class="top-row">
            <div class="title-block">
                <h1>Invitees Uploader</h1>
                <p class="subtitle">Preview, then append or overwrite the <span class="mono">invitees</span> table in Supabase.</p>
            </div>
            <div class="d-flex gap-2">
                <button id="viewListBtn" class="btn-ghost btn">View invitee list</button>
                <button id="logoutBtn" class="btn btn-outline-secondary">Log out</button>
            </div>
        </div>

        <div id="dropzone" class="dropzone">
            <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" style="display:none;">
            <label for="fileInput">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span>
                    <span class="primary">Click to upload or drag and drop</span><br>
                    <span class="secondary">CSV, XLSX, or XLS files</span>
                </span>
            </label>
        </div>

        <div id="errorContainer" class="panel panel-error hidden"></div>
        <div id="statusContainer" class="panel panel-status hidden"></div>
        <div id="summaryContainer" class="stat-strip hidden"></div>

        <div id="tableContainer" class="surface-card table-card hidden">
            <div class="table-toolbar">
                <span id="fileMeta" class="file-meta"></span>
                <div class="btn-group-actions">
                    <button id="appendBtn" class="btn-emerald btn">Append new records</button>
                    <button id="overwriteBtn" class="btn-amber btn">Overwrite entire table</button>
                    <button id="clearBtn" class="btn-rose btn">Clear</button>
                </div>
            </div>
            <div class="table-scroll">
                <table id="csvTable" class="data-table">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="viewListContainer" class="surface-card table-card hidden">
            <div class="table-toolbar">
                <span id="viewListMeta" class="file-meta"></span>
                <div class="btn-group-actions">
                    <button id="downloadCsvBtn" class="btn-emerald btn">Download CSV</button>
                    <button id="downloadXlsxBtn" class="btn-amber btn">Download Excel</button>
                    <button id="closeViewListBtn" class="btn-ghost btn">Close</button>
                </div>
            </div>
            <div class="table-scroll">
                <table id="viewListTable" class="data-table">
                    <thead id="viewListHeader"></thead>
                    <tbody id="viewListBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="confirmModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3 id="confirmTitle"></h3>
            <div id="confirmBody" class="modal-body"></div>
            <div class="modal-actions">
                <button id="confirmCancel" class="btn-ghost btn">Cancel</button>
                <button id="confirmProceed" class="btn"></button>
            </div>
        </div>
    </div>

    <script type="module" src="./invitees.js"></script>
</body>
</html>
